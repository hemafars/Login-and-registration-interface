<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Tasks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="d-flex flex-column justify-content-center align-items-center vh-100 bg-secondary">
    <h1>Registration</h1>
    <form action="" class="w-50 d-flex flex-column bg-dark p-5">
      <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label text-white">your name</label>
        <input type="email" class="form-control" id="nameRegistration" placeholder="your name">
      </div>
      <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label text-white">Email address</label>
        <input type="email" class="form-control" id="emailRegistration" placeholder="name@example.com">
      </div>
      <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label text-white">password</label>
        <input type="password" class="form-control" id="passwordRegistration" placeholder="password">
      </div>
      <button type="button" class="btn btn-primary" onclick="addtolocalstorg()" id="Registration">Registration</button>
    </form>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script src="script.js"></script>
</body>

</html>
